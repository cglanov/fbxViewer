<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>FBX 30s Orbit Studio</title>
  <style>
    :root {
      --bg: #0f1115;
      --panel: #181b22;
      --border: #2a2f3a;
      --text: #e6e8ee;
      --muted: #949ba8;
      --accent: #3b82f6;
      --accent-hover: #2563eb;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: system-ui, -apple-system, sans-serif;
      background: var(--bg);
      color: var(--text);
      display: grid;
      grid-template-columns: 320px 1fr;
      height: 100vh;
      overflow: hidden;
    }
    aside {
      background: var(--panel);
      border-right: 1px solid var(--border);
      padding: 1.25rem;
      display: flex;
      flex-direction: column;
      gap: 1rem;
      overflow-y: auto;
    }
    h1 { font-size: 1.1rem; margin: 0; }
    .subtitle { font-size: 0.82rem; color: var(--muted); margin: 0.25rem 0 0; }
    .dropzone {
      border: 2px dashed var(--border);
      border-radius: 8px;
      padding: 1.25rem 1rem;
      text-align: center;
      cursor: pointer;
      transition: border-color 0.15s, background 0.15s;
      font-size: 0.85rem;
      color: var(--muted);
    }
    .dropzone.dragover {
      border-color: var(--accent);
      background: rgba(59, 130, 246, 0.08);
      color: var(--text);
    }
    .control-group { display: flex; flex-direction: column; gap: 0.35rem; }
    label { font-size: 0.8rem; color: var(--muted); display: flex; justify-content: space-between; }
    select, input[type="range"], input[type="color"] {
      width: 100%;
      background: var(--bg);
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 0.45rem;
      font-size: 0.85rem;
    }
    input[type="color"] { height: 34px; padding: 2px; cursor: pointer; }
    .checkbox-row {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      font-size: 0.85rem;
      color: var(--text);
      cursor: pointer;
    }
    button {
      padding: 0.65rem 1rem;
      border: none;
      border-radius: 6px;
      font-weight: 600;
      font-size: 0.88rem;
      cursor: pointer;
      background: var(--accent);
      color: #fff;
    }
    button:hover:not(:disabled) { background: var(--accent-hover); }
    button:disabled { opacity: 0.4; cursor: not-allowed; }
    button.secondary { background: #374151; }
    progress { width: 100%; height: 8px; border-radius: 4px; overflow: hidden; }
    #status { font-size: 0.8rem; color: #4ade80; line-height: 1.4; }
    main {
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1.5rem;
      position: relative;
    }
    canvas {
      max-width: 100%;
      max-height: 100%;
      border: 1px solid var(--border);
      border-radius: 8px;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5);
    }
    @media (max-width: 820px) {
      body { grid-template-columns: 1fr; grid-template-rows: auto 1fr; height: auto; overflow: auto; }
      canvas { width: 100%; height: auto; }
    }
  </style>
  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/",
        "mp4-muxer": "https://cdn.jsdelivr.net/npm/mp4-muxer@5.1.3/build/mp4-muxer.mjs"
      }
    }
  </script>
</head>
<body>
  <aside>
    <div>
      <h1>FBX 30s Orbit Studio</h1>
      <p class="subtitle">Auto-framed 360° turnaround MP4 generator</p>
    </div>

    <div class="dropzone" id="dropzone">
      <strong>Drop .fbx file here</strong><br />or click to browse
      <input type="file" id="fileInput" accept=".fbx" hidden />
    </div>

    <div class="control-group">
      <label for="clipSelect">Animation Clip</label>
      <select id="clipSelect" disabled><option>No model loaded</option></select>
    </div>

    <div class="control-group">
      <label for="resolutionSelect">Output Resolution (30s @ 30fps)</label>
      <select id="resolutionSelect">
        <option value="1280x720" selected>1280 × 720 (HD 16:9)</option>
        <option value="1920x1080">1920 × 1080 (Full HD 16:9)</option>
        <option value="1080x1080">1080 × 1080 (Square 1:1)</option>
      </select>
    </div>

    <div class="control-group">
      <label>Camera Elevation <span id="elevVal">15°</span></label>
      <input type="range" id="elevSlider" min="-20" max="60" value="15" />
    </div>

    <div class="control-group">
      <label>Orbits in 30s <span id="orbitVal">1×</span></label>
      <input type="range" id="orbitSlider" min="1" max="3" step="1" value="1" />
    </div>

    <div class="control-group">
      <label>Framing Padding <span id="padVal">1.35×</span></label>
      <input type="range" id="padSlider" min="1.1" max="2.0" step="0.05" value="1.35" />
    </div>

    <div class="control-group">
      <label for="bgColor">Background Color</label>
      <input type="color" id="bgColor" value="#1a1d24" />
    </div>

    <label class="checkbox-row">
      <input type="checkbox" id="gridToggle" checked />
      Show reference floor grid
    </label>

    <button id="exportBtn" disabled>Export 30s MP4</button>
    <button id="cancelBtn" class="secondary" hidden>Cancel Render</button>

    <progress id="progressBar" value="0" max="900" hidden></progress>
    <div id="status">Upload an animated .fbx to preview.</div>
  </aside>

  <main>
    <canvas id="viewport" width="1280" height="720"></canvas>
  </main>

  <script type="module" src="./app.js"></script>
</body>
</html>
